name: Deploy Admin Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'

concurrency:
  group: admin-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BLOG_GITHUB_PAT: ${{ secrets.BLOG_GITHUB_PAT }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BLOG_GITHUB_PAT ADMIN_PASSWORD SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install admin dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Vditor assets
        run: pnpm sync-vditor

      - name: Check Worker types
        run: pnpm check

      - name: Prepare Cloudflare resources
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          NORMALIZED_NAME="$(printf '%s' "$REPOSITORY_NAME" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-')"
          echo "WORKER_NAME=${{ vars.ADMIN_WORKER_NAME || '' }}" >> "$GITHUB_ENV"
          echo "D1_DATABASE_NAME=${{ vars.ADMIN_D1_NAME || '' }}" >> "$GITHUB_ENV"
          echo "DEFAULT_WORKER_NAME=${NORMALIZED_NAME}-admin" >> "$GITHUB_ENV"
          echo "DEFAULT_D1_NAME=${NORMALIZED_NAME}-admin-db" >> "$GITHUB_ENV"

      - name: Provision D1 and generate Wrangler config
        shell: bash
        run: |
          export WORKER_NAME="${WORKER_NAME:-$DEFAULT_WORKER_NAME}"
          export D1_DATABASE_NAME="${D1_DATABASE_NAME:-$DEFAULT_D1_NAME}"
          echo "RESOLVED_WORKER_NAME=$WORKER_NAME" >> "$GITHUB_ENV"
          echo "RESOLVED_D1_NAME=$D1_DATABASE_NAME" >> "$GITHUB_ENV"
          node scripts/prepare-cloudflare-deploy.mjs

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply "$RESOLVED_D1_NAME" --remote --config wrangler.generated.jsonc

      - name: Create or update Worker
        run: pnpm exec wrangler deploy --config wrangler.generated.jsonc

      - name: Inject Worker secrets
        shell: bash
        run: |
          printf '%s' "$BLOG_GITHUB_PAT" | pnpm exec wrangler secret put GITHUB_TOKEN --name "$RESOLVED_WORKER_NAME" --config wrangler.generated.jsonc
          printf '%s' "$ADMIN_PASSWORD" | pnpm exec wrangler secret put ADMIN_PASSWORD --name "$RESOLVED_WORKER_NAME" --config wrangler.generated.jsonc
          printf '%s' "$SESSION_SECRET" | pnpm exec wrangler secret put SESSION_SECRET --name "$RESOLVED_WORKER_NAME" --config wrangler.generated.jsonc
