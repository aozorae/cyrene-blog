name: Deploy Personal Admin Worker

on:
  workflow_dispatch:
  push:
    branches:
      - personal-blog
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-personal-admin.yml'

concurrency:
  group: personal-admin-worker-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_name == 'personal-blog' && vars.PERSONAL_ADMIN_DEPLOY_ENABLED == 'true'
    environment: personal-blog
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BLOG_GITHUB_PAT: ${{ secrets.PERSONAL_BLOG_GITHUB_PAT }}
      ADMIN_PASSWORD: ${{ secrets.PERSONAL_ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.PERSONAL_SESSION_SECRET }}
      WORKER_NAME: ${{ vars.PERSONAL_ADMIN_WORKER_NAME || 'cyrene-personal-admin' }}
      D1_DATABASE_NAME: ${{ vars.PERSONAL_ADMIN_D1_NAME || 'cyrene-personal-admin-db' }}

    steps:
      - name: Checkout personal branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: personal-blog

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BLOG_GITHUB_PAT ADMIN_PASSWORD SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Missing required personal-blog environment secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install admin dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Vditor assets
        run: pnpm sync-vditor

      - name: Check Worker types
        run: pnpm check

      - name: Provision D1 and generate Wrangler config
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.generated.jsonc

      - name: Create or update Worker
        run: pnpm exec wrangler deploy --config wrangler.generated.jsonc

      - name: Inject Worker secrets
        shell: bash
        run: |
          printf '%s' "$BLOG_GITHUB_PAT" | pnpm exec wrangler secret put GITHUB_TOKEN --name "$WORKER_NAME" --config wrangler.generated.jsonc
          printf '%s' "$ADMIN_PASSWORD" | pnpm exec wrangler secret put ADMIN_PASSWORD --name "$WORKER_NAME" --config wrangler.generated.jsonc
          printf '%s' "$SESSION_SECRET" | pnpm exec wrangler secret put SESSION_SECRET --name "$WORKER_NAME" --config wrangler.generated.jsonc
