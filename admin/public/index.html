<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f0f3f8" />
		<title>登录 · 昔涟管理后台</title>
		<link rel="icon" href="/favicon.png" />
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
			<main class="auth-layout">
				<section class="auth-card" aria-labelledby="login-title">
					<button id="login-language-toggle" class="language-toggle auth-language-toggle" type="button"><img class="language-icon" src="/translate.svg" alt="" aria-hidden="true" /><span data-language-code>EN</span></button>
					<div class="brand-lockup"><span class="brand-mark" aria-hidden="true">C</span><span>CYRENE <small>ADMIN</small></span></div>
				<p class="eyebrow">BLOG MANAGEMENT</p>
				<h1 id="login-title">管理你的博客</h1>
				<p class="auth-copy">连接 GitHub 仓库，整理站点配置并发布新的内容。</p>
				<form id="login-form" class="stack-form">
					<input class="sr-only" name="username" autocomplete="username" value="admin" tabindex="-1" aria-hidden="true" />
					<label for="admin-password">管理密码</label>
					<input id="admin-password" type="password" autocomplete="current-password" placeholder="输入后台密码" required />
					<button class="button button-primary" type="submit">进入管理后台</button>
					<p id="login-error" class="form-error" role="alert"></p>
				</form>
				<p class="auth-note">配置与内容提交到 GitHub 后由静态托管平台自动部署。</p>
			</section>
		</main>
		<script src="/pages/login.js" type="module"></script>
	</body>
</html>
