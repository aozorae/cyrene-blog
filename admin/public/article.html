<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f0f3f8" />
		<title>发布文章 · Cyrene 管理后台</title>
		<link rel="icon" href="/favicon.png" />
		<link rel="stylesheet" href="/vendor/vditor/dist/index.css" />
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<main id="app-shell" class="app-shell hidden">
			<aside id="admin-sidebar" class="sidebar"></aside>
			<section class="workspace">
				<header id="admin-topbar" class="topbar"></header>
				<div class="view">
					<div class="section-intro"><span class="section-kicker">内容</span><p>编写文章并保存到 D1 草稿，确认后再提交到 GitHub。</p></div>
					<form id="article-form" class="article-layout">
						<section class="panel article-main">
							<div class="panel-heading"><div><h3 id="article-form-title">新文章</h3><p>使用 Vditor 编写和预览 Markdown 正文。</p></div><button id="article-reset" class="button button-quiet compact-button" type="button">新建</button></div>
							<div class="field"><label for="article-title">标题</label><input id="article-title" required maxlength="120" placeholder="给文章一个清晰的标题" /></div>
							<div class="field"><label for="article-description">摘要</label><input id="article-description" maxlength="240" placeholder="会显示在文章卡片和 RSS 中" /></div>
							<div class="field"><label id="article-content-label">正文（Markdown）</label><div id="article-content-editor" class="article-editor-shell" aria-labelledby="article-content-label"></div><textarea id="article-content" hidden></textarea></div>
						</section>
						<aside class="panel article-side">
							<div class="panel-heading"><div><h3>文章信息</h3><p>设置路径、分类和展示信息。</p></div></div>
							<div class="field"><label for="article-slug">Slug（可选）</label><input id="article-slug" placeholder="自动根据标题生成" /></div>
							<div class="field"><label for="article-directory">目录（可选）</label><input id="article-directory" placeholder="guide" /></div>
							<div class="field"><label for="article-category">分类</label><input id="article-category" value="随笔" /></div>
							<div class="field"><label for="article-tags">标签</label><input id="article-tags" placeholder="Astro, 学习笔记" /></div>
							<div class="field"><label for="article-image">封面图片地址</label><input id="article-image" placeholder="https://... 或相对路径" /></div>
							<div class="field"><label for="article-published">发布时间</label><input id="article-published" type="date" /></div>
							<input id="article-original-path" type="hidden" /><input id="article-draft-id" type="hidden" />
							<div class="publish-note"><strong>提交后会发生什么？</strong><span>后台创建 GitHub commit，静态托管平台检测到提交后自动部署。</span></div>
							<p id="article-status" class="inline-status"></p>
							<div class="button-stack"><button id="article-draft-save" class="button button-quiet button-full" type="button">保存草稿</button><button class="button button-primary button-full" type="submit">提交到 GitHub</button></div>
						</aside>
					</form>
				</div>
			</section>
		</main>
		<div id="toast" class="toast" role="status" aria-live="polite"></div>
		<script id="vditorIconScript" src="/vendor/vditor/dist/js/icons/ant.js"></script>
		<script src="/vendor/vditor/dist/index.min.js"></script>
		<script src="/pages/article.js" type="module"></script>
	</body>
</html>
